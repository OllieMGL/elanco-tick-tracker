<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- green square background, same green as the navbar -->
  <rect width="32" height="32" rx="6" fill="#166534" />

  <!-- 8 legs, 4 on each side -->
  <g stroke="#fefce8" stroke-width="1.5" stroke-linecap="round">
    <line x1="11" y1="14" x2="5" y2="10" />
    <line x1="10.5" y1="17" x2="4" y2="16" />
    <line x1="10.5" y1="20" x2="4" y2="22" />
    <line x1="11" y1="23" x2="6" y2="28" />
    <line x1="21" y1="14" x2="27" y2="10" />
    <line x1="21.5" y1="17" x2="28" y2="16" />
    <line x1="21.5" y1="20" x2="28" y2="22" />
    <line x1="21" y1="23" x2="26" y2="28" />
  </g>

  <!-- head and body -->
  <ellipse cx="16" cy="10" rx="2.5" ry="2" fill="#fefce8" />
  <ellipse cx="16" cy="18" rx="6" ry="7" fill="#fefce8" />
</svg>
